<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xiaobu Chinese</title>
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one narrow column (max 520px). Home lists lessons; a lesson has Words, Cards and Quiz tabs. Blue-and-white porcelain palette, one red seal stamp as the only loud detail. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --line: #d5deec;
  --ink: #12203a;
  --muted: #55657f;
  --accent: #1f4fa3;
  --accent-ink: #ffffff;
  --accent-soft: #e3ebfa;
  --seal: #c4372c;
  --ok: #1d7a4f;
  --ok-soft: #def3e8;
  --bad: #b3261e;
  --bad-soft: #fbe4e1;
  --ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hanzi: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1322; --card: #141d33; --line: #26334f; --ink: #e6ecf8; --muted: #93a3c2;
    --accent: #7da2ff; --accent-ink: #0c1322; --accent-soft: #1b2a4d; --seal: #e2594d;
    --ok: #5fd39a; --ok-soft: #123326; --bad: #ff8a80; --bad-soft: #3a1a1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1322; --card: #141d33; --line: #26334f; --ink: #e6ecf8; --muted: #93a3c2;
  --accent: #7da2ff; --accent-ink: #0c1322; --accent-soft: #1b2a4d; --seal: #e2594d;
  --ok: #5fd39a; --ok-soft: #123326; --bad: #ff8a80; --bad-soft: #3a1a1a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.45;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center;
}
.app { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 1.3rem; font-weight: 700; text-wrap: balance; }
.zh { font-family: var(--hanzi); font-weight: 700; }
.eyebrow { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); max-width: 46ch; }
.hero { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.bar { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.meter { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; font-weight: 700;
  padding: 12px 18px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn:active { transform: translateY(1px); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.unit {
  display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px;
}
.unit .glyph { font-family: var(--hanzi); font-weight: 700; font-size: 1.6rem; color: var(--accent); background: var(--accent-soft); border-radius: 10px; height: 64px; display: grid; place-items: center; }
.unit .meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.unit .t { font-weight: 700; font-size: 1.05rem; }
.unit .d { color: var(--muted); font-size: 0.9rem; }
.unit .foot { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit .foot .bar { flex: 1; }
.units { display: flex; flex-direction: column; gap: 10px; }
.tone-link { border-color: var(--accent); }
.partHead { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; }
.tag { display: inline-block; vertical-align: middle; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; margin-left: 4px; }
.word .zh.long { font-size: 1.35rem; }
.exbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; margin-top: 8px; padding: 8px 10px; background: var(--accent-soft); border: 0; border-radius: 10px; text-align: left; color: var(--accent); min-height: 44px; }
.exb { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.exz { font-size: 1.15rem; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.exp { color: var(--accent); font-size: 0.85rem; font-weight: 600; }
.exe { color: var(--muted); font-size: 0.85rem; }
.exbox { width: 100%; border-top: 1.5px solid var(--line); margin-top: 6px; padding-top: 12px; display: flex; flex-direction: column; gap: 2px; }
.exz2 { font-size: 1.35rem; font-weight: 500; overflow-wrap: anywhere; }
.flash .zh.xl { font-size: 1.9rem; }
.qcard .zh.xl { font-size: 1.6rem; }
.qcard .zh.cloze { font-size: 2rem; font-weight: 500; line-height: 1.3; }
.blank { color: var(--accent); letter-spacing: 2px; border-bottom: 3px solid var(--accent); }
.en-big.sm { font-size: 1.05rem; font-weight: 600; color: var(--muted); }
details.g { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; }
details.g summary { cursor: pointer; padding: 14px 44px 14px 14px; list-style: none; display: flex; flex-direction: column; gap: 4px; min-height: 48px; position: relative; }
details.g summary::-webkit-details-marker { display: none; }
details.g summary::after { content: '+'; position: absolute; right: 16px; top: 10px; font-size: 1.5rem; color: var(--accent); line-height: 1.2; }
details.g[open] summary::after { content: '\2013'; }
details.g[open] summary { border-bottom: 1.5px solid var(--line); }
details.g summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 14px; }
.gt { font-weight: 700; font-size: 1.05rem; }
.gp { color: var(--accent); font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
.gb { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.why { color: var(--ink); }
.gex { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stars { color: var(--seal); letter-spacing: 2px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { background: none; border: 0; padding: 8px 8px 8px 0; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; }
.brand { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.brand .zh { color: var(--seal); font-size: 1.3rem; }
.toggle { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; min-height: 36px; }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.tabs { display: flex; gap: 6px; background: var(--accent-soft); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 700; color: var(--muted); min-height: 44px; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

.words { display: flex; flex-direction: column; gap: 8px; }
.word { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 14px; }
.word .zh { font-size: 1.7rem; line-height: 1.2; overflow-wrap: anywhere; }
.word .py { color: var(--accent); font-weight: 600; font-size: 0.95rem; }
.word .en { color: var(--muted); font-size: 0.95rem; }
.word .acts { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.stamp { width: 26px; height: 26px; background: var(--seal); color: #fff; border-radius: 4px; display: grid; place-items: center; font-family: var(--hanzi); font-weight: 700; font-size: 0.95rem; transform: rotate(-6deg); }
.stamp.lg { width: 84px; height: 84px; font-size: 3rem; border-radius: 8px; }

.flash { width: 100%; min-height: 280px; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; }
.flash .zh { font-size: 5.5rem; line-height: 1.1; color: var(--ink); overflow-wrap: anywhere; }
.flash .zh.long { font-size: 2.8rem; }
.flash .py-big { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
.flash .en-big { font-size: 1.5rem; font-weight: 600; }
.flash .tap { font-size: 0.85rem; color: var(--muted); }
.count { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }

.qcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.q-label { color: var(--muted); font-weight: 600; font-size: 0.95rem; }
.qcard .zh { font-size: 4rem; line-height: 1.15; overflow-wrap: anywhere; }
.qcard .zh.long { font-size: 2.2rem; }
.en-big { font-size: 1.6rem; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-weight: 600; font-size: 1.05rem; }
.opt .zh { font-size: 1.5rem; }
.opt small { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
.opt.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.opt.dim { opacity: 0.55; }
.fb { font-weight: 700; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }
.result { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.result .score { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }

.tones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tone { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.tone svg.chart { width: 100%; height: auto; color: var(--accent); }
.tone .name { font-weight: 700; font-size: 0.9rem; color: var(--muted); }
.tone .ex { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.tone .ex .zh { font-size: 2rem; }
.tone .ex b { font-size: 1.2rem; color: var(--accent); }
.tone .mean { font-size: 0.9rem; color: var(--muted); }
.tip { background: var(--accent-soft); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.tip b { color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; z-index: 20; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

    h += '<button class="flash" type="button" data-act="flip" aria-label="Flip card">';
    if (!c.flipped) {
      h += '<div class="zh' + cls(w) + '" lang="zh-CN">' + w.zh + '</div>' + (P.pinyin ? '<div class="py">' + w.py + '</div>' : '') + '<div class="tap">Tap to see the answer</div>';
    } else {
      h += '<div class="zh' + cls(w) + '" lang="zh-CN">' + w.zh + '</div><div class="py-big">' + w.py + '</div><div class="en-big">' + w.en + '</div>';
      if (w.ex) h += '<div class="exbox"><div class="zh exz2" lang="zh-CN">' + w.ex.zh + '</div><div class="exp">' + w.ex.py + '</div><div class="exe">' + w.ex.en + '</div></div>';
    }
    h += '</button><div class="row"><button class="btn ghost" type="button" data-act="say" data-id="' + w.id + '">' + ICON.speaker + 'Listen</button>' +
      (w.ex && c.flipped ? '<button class="btn ghost" type="button" data-act="sayex" data-id="' + w.id + '">' + ICON.speaker + 'Hear sentence</button>' : '') + '</div>';
    if (c.flipped) {
      h += '<div class="row"><button class="btn line" type="button" data-act="again">Again</button><button class="btn" type="button" data-act="got">Got it</button></div>';
    }
    return h;
  }

  function canListen() { return !!zhVoice(); }

  function startQuiz() {
    var pool = wordsOf(S.unit);
    var n = S.unit === 'mix' ? 10 : Math.min(8, pool.length);
    var types = ['meaning', 'hanzi'];
    if (canListen()) types.push('listen');
    var qs = shuffle(pool.slice()).slice(0, n).map(function (w) {
      var ts = types.slice();
      if (w.ex) ts.push('cloze', 'cloze');
      var t = ts[rand(ts.length)];
      var seen = {}; seen[w.en] = true;
      var others = [];
      shuffle(pool.slice()).forEach(function (x) {
        if (others.length >= 3 || seen[x.en] || (t === 'listen' && x.py === w.py)) return;
        seen[x.en] = true; others.push(x);
      });
      return { w: w, t: t, opts: shuffle([w].concat(others)) };
    });
    S.quiz = { qs: qs, i: 0, score: 0, picked: null, done: false, stars: 0 };
  }

  function quizV() {
    var q = S.quiz;
    if (q.done) {
      var pct = q.score / q.qs.length, pass = pct >= 0.7;
      return '<div class="result">' + (pass ? '<div class="stamp lg" lang="zh-CN">好</div>' : '') +
        '<div class="score">' + q.score + ' / ' + q.qs.length + '</div><div class="stars" style="font-size:1.6rem">' + '★'.repeat(q.stars) + '☆'.repeat(3 - q.stars) + '</div>' +
        '<h2>' + (pct >= 0.9 ? 'Excellent' : pass ? 'Well done' : 'Keep practicing') + '</h2>' +
        '<p class="lede">' + (pass ? 'You are getting these. Try another lesson or run it again for 3 stars.' : 'Review the words and cards, then try again. Repeating is how it sticks.') + '</p>' +
        '<div class="row"><button class="btn" type="button" data-act="retry">Try again</button><button class="btn line" type="button" data-act="home">All lessons</button></div></div>';
    }
    var c = q.qs[q.i], w = c.w, picked = q.picked;
    var h = '<div class="count"><span>Question ' + (q.i + 1) + ' of ' + q.qs.length + '</span><span>Score ' + q.score + '</span></div>';
    h += '<div class="bar"><i style="width:' + Math.round(q.i / q.qs.length * 100) + '%"></i></div><div class="qcard">';
    if (c.t === 'meaning') h += '<p class="q-label">What does this mean?</p><div class="zh' + cls(w) + '" lang="zh-CN">' + w.zh + '</div>' + (P.pinyin ? '<div class="py" style="color:var(--accent);font-weight:600">' + w.py + '</div>' : '');
    else if (c.t === 'hanzi') h += '<p class="q-label">Which one means</p><div class="en-big">' + w.en + '</div>';
    else if (c.t === 'cloze') h += '<p class="q-label">Fill in the blank</p><div class="zh cloze" lang="zh-CN">' + w.ex.zh.replace(w.zh, '<span class="blank">＿＿</span>') + '</div><div class="en-big sm">' + w.ex.en + '</div>';
    else h += '<p class="q-label">Listen, then choose the meaning</p><button class="btn ghost" type="button" data-act="playq">' + ICON.speaker + 'Play sound</button>';
    h += '</div><div class="opts">';
    c.opts.forEach(function (o) {
      var state = '';
      var mark = '';
      if (picked) {
        if (o.id === w.id) { state = ' ok'; mark = '✓ '; }
        else if (o.id === picked) { state = ' bad'; mark = '✗ '; }
        else state = ' dim';
      }
      var body = (c.t === 'hanzi' || c.t === 'cloze')
        ? '<span class="zh" lang="zh-CN">' + mark + o.zh + '</span>' + (P.pinyin || picked ? '<small>' + o.py + '</small>' : '')
        : '<span>' + mark + o.en + '</span>';
      h += '<button class="opt' + state + '" type="button" data-act="pick" data-id="' + o.id + '"' + (picked ? ' disabled' : '') + '>' + body + '</button>';
    });
    h += '</div>';
    if (picked) {
      h += picked === w.id
        ? '<p class="fb ok">Correct!' + (c.t === 'cloze' ? ' <span lang="zh-CN">' + w.ex.zh + '</span> ' + w.ex.py : '') + '</p>'
        : '<p class="fb bad">Not quite. <span lang="zh-CN">' + w.zh + '</span> (' + w.py + ') means "' + w.en + '".' + (c.t === 'cloze' ? ' <span lang="zh-CN">' + w.ex.zh + '</span> ' + w.ex.py : '') + '</p>';
      h += '<button class="btn" type="button" data-act="next">' + (q.i + 1 === q.qs.length ? 'See results' : 'Next') + '</button>';
    }
    return h;
  }

  function tonesV() {
    var T = [
      { n: '1st tone', d: 'high and flat', path: 'M10 12 L110 12', zh: '妈', py: 'mā', en: 'mother' },
      { n: '2nd tone', d: 'rising, like a question', path: 'M10 42 L110 12', zh: '麻', py: 'má', en: 'hemp' },
      { n: '3rd tone', d: 'dips down, then up', path: 'M10 54 L45 68 L110 28', zh: '马', py: 'mǎ', en: 'horse' },
      { n: '4th tone', d: 'sharp and falling', path: 'M10 12 L110 68', zh: '骂', py: 'mà', en: 'to scold' }
    ];
    var h = '<div class="topbar"><button class="back" type="button" data-act="home">' + ICON.back + 'Lessons</button></div>';
    h += '<section class="hero"><p class="eyebrow">Before anything else</p><h1>The four tones</h1><p class="lede">Mandarin changes meaning with the pitch of your voice. The sound "ma" below is the same four times, only the pitch changes. Tap the speaker to hear each one.</p></section>';
    h += '<div class="tones">' + T.map(function (t) {
      return '<div class="tone"><span class="name">' + t.n + '</span>' +
        '<svg class="chart" viewBox="0 0 120 80" role="img" aria-label="Pitch shape of the ' + t.n + ': ' + t.d + '">' +
        '<g stroke="currentColor" stroke-opacity="0.18" stroke-width="1"><line x1="0" y1="12" x2="120" y2="12"/><line x1="0" y1="26" x2="120" y2="26"/><line x1="0" y1="40" x2="120" y2="40"/><line x1="0" y1="54" x2="120" y2="54"/><line x1="0" y1="68" x2="120" y2="68"/></g>' +
        '<path d="' + t.path + '" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="' + t.path.split(' ')[0].slice(1) + '" cy="' + t.path.split(' ')[1] + '" r="6" fill="currentColor"/></svg>' +
        '<span class="mean">' + t.d + '</span>' +
        '<div class="ex"><span class="zh" lang="zh-CN">' + t.zh + '</span><b>' + t.py + '</b><button class="icon-btn" type="button" data-act="say" data-say="' + t.zh + '" aria-label="Play ' + t.py + '">' + ICON.speaker + '</button></div>' +
        '<span class="mean">' + t.en + '</span></div>';
    }).join('') + '</div>';
    h += '<div class="tip"><b>Neutral tone</b><span>Some syllables are short and light, with no tone mark, like the second part of 妈妈 (māma) or the question word 吗 (ma).</span></div>';
    h += '<div class="tip"><b>Two 3rd tones in a row</b><span>The first one is spoken as a 2nd tone. So 你好 is written nǐ hǎo but said like ní hǎo.</span></div>';
    h += '<button class="btn" type="button" data-act="unit" data-id="hello">Start with greetings</button>';
    return h;
  }

  var GR = [
    { t: 'Comparing with 比', pat: 'A + 比 + B + adjective',
      why: 'Use 比 (bǐ) to say one thing is more than another. The adjective goes at the end. Do not add 很 (very) before it.',
      ex: [['我比他高。', 'wǒ bǐ tā gāo.', 'I am taller than him.'], ['今天比昨天冷。', 'jīntiān bǐ zuótiān lěng.', 'Today is colder than yesterday.'], ['这个比那个便宜。', 'zhège bǐ nàge piányi.', 'This one is cheaper than that one.']] },
    { t: 'Because, so', pat: '因为 + reason，所以 + result',
      why: 'In English you say "because" or "so", not both. In Chinese you can use both in one sentence. 因为 (yīnwèi) gives the reason and 所以 (suǒyǐ) gives the result.',
      ex: [['因为下雨，所以我在家。', 'yīnwèi xiàyǔ, suǒyǐ wǒ zài jiā.', "Because it's raining, I'm staying home."], ['因为我很忙，所以不能去。', 'yīnwèi wǒ hěn máng, suǒyǐ bù néng qù.', "Because I'm busy, I can't go."]] },
    { t: 'Although, but', pat: '虽然 + A，但是 + B',
      why: '虽然 (suīrán) means "although" and 但是 (dànshì) means "but". Like the last point, Chinese uses both together.',
      ex: [['虽然很贵，但是很好吃。', 'suīrán hěn guì, dànshì hěn hǎochī.', "Although it's expensive, it's tasty."], ['虽然他很小，但是他会说汉语。', 'suīrán tā hěn xiǎo, dànshì tā huì shuō Hànyǔ.', "Although he is little, he can speak Chinese."]] },
    { t: 'Have you ever? with 过', pat: 'verb + 过   |   没 + verb + 过',
      why: 'Add 过 (guo) after a verb to say you have done something before. To say "never", put 没 before the verb and keep 过.',
      ex: [['我去过北京。', 'wǒ qù guo Běijīng.', 'I have been to Beijing.'], ['我没吃过羊肉。', 'wǒ méi chī guo yángròu.', 'I have never eaten lamb.'], ['你学过汉语吗？', 'nǐ xué guo Hànyǔ ma?', 'Have you studied Chinese before?']] },
    { t: 'Doing it right now', pat: 'subject + 正在 / 在 + verb',
      why: 'Put 正在 (zhèngzài) or 在 (zài) before a verb to say it is happening right now. Chinese has no "-ing" ending.',
      ex: [['我正在吃饭。', 'wǒ zhèngzài chī fàn.', "I'm eating right now."], ['他在看电视。', 'tā zài kàn diànshì.', 'He is watching TV.'], ['妈妈正在做饭。', 'māma zhèngzài zuòfàn.', 'Mom is cooking.']] },
    { t: 'Finished actions with 了', pat: 'verb + 了 (+ amount + noun)',
      why: 'Add 了 (le) after a verb to show the action is done. It marks "finished", so it is not the same as the English past tense.',
      ex: [['我买了一本书。', 'wǒ mǎi le yì běn shū.', 'I bought a book.'], ['我吃了早饭。', 'wǒ chī le zǎofàn.', 'I ate breakfast.']] },
    { t: 'About to happen', pat: '要 + verb + 了',
      why: 'Use 要 ... 了 (yào ... le) to say something will happen very soon. Think "is about to".',
      ex: [['要下雨了。', 'yào xiàyǔ le.', "It's about to rain."], ['我们要到了。', 'wǒmen yào dào le.', "We're about to arrive."], ['车要开了。', 'chē yào kāi le.', 'The bus is about to leave.']] },
    { t: 'How well? with 得', pat: 'verb + 得 + adjective',
      why: 'To say how well or how fast someone does something, put 得 (de) after the verb, then the adjective.',
      ex: [['她唱得很好。', 'tā chàng de hěn hǎo.', 'She sings very well.'], ['他跑得很快。', 'tā pǎo de hěn kuài.', 'He runs very fast.'], ['我说得不好。', 'wǒ shuō de bù hǎo.', "I don't speak well."]] },
    { t: 'Three ways to say can', pat: '会 = learned skill   |   能 = able to   |   可以 = allowed to',
      why: '会 (huì) is a skill you learned, like speaking Chinese. 能 (néng) is being able to do something in a situation. 可以 (kěyǐ) is being allowed to do something.',
      ex: [['我会说汉语。', 'wǒ huì shuō Hànyǔ.', 'I can speak Chinese (I learned it).'], ['我今天不能来。', 'wǒ jīntiān bù néng lái.', "I can't come today."], ['这里可以坐吗？', 'zhèlǐ kěyǐ zuò ma?', 'May I sit here?']] },
    { t: 'Telling someone not to', pat: '别 + verb',
      why: 'Put 别 (bié) before a verb to say "don\'t". It is short and very common in daily speech.',
      ex: [['别走。', 'bié zǒu.', "Don't go."], ['别担心。', 'bié dānxīn.', "Don't worry."], ['别说话。', 'bié shuōhuà.', "Don't talk."]] },
    { t: 'Suggestions with 吧', pat: 'sentence + 吧',
      why: 'Add 吧 (ba) at the end of a sentence to make a suggestion or a soft request. It can mean "let\'s" or "how about".',
      ex: [['我们走吧。', 'wǒmen zǒu ba.', "Let's go."], ['你先吃吧。', 'nǐ xiān chī ba.', 'You go ahead and eat.'], ['好吧。', 'hǎo ba.', 'Okay then.']] },
    { t: 'A little, a moment: 一下', pat: 'verb + 一下',
      why: 'After a verb, 一下 (yíxià) means "a little" or "for a moment". It makes requests sound softer and more polite.',
      ex: [['请等一下。', 'qǐng děng yíxià.', 'Please wait a moment.'], ['我看一下。', 'wǒ kàn yíxià.', 'Let me take a look.'], ['我来介绍一下。', 'wǒ lái jièshào yíxià.', 'Let me introduce.']] },
    { t: 'Distance and range', pat: 'A + 离 + B + far/near   |   从 A 到 B',
      why: 'Use 离 (lí) for the distance between two places. Use 从 (cóng) ... 到 (dào) for "from ... to ...", for places or for time.',
      ex: [['我家离学校很近。', 'wǒ jiā lí xuéxiào hěn jìn.', 'My home is close to school.'], ['从我家到公司要一个小时。', 'cóng wǒ jiā dào gōngsī yào yí ge xiǎoshí.', 'From my home to the company takes an hour.'], ['我从八点工作到五点。', 'wǒ cóng bā diǎn gōngzuò dào wǔ diǎn.', 'I work from eight to five.']] },
    { t: 'Two: 两 or 二?', pat: '两 + measure word   |   二 for counting and numbers',
      why: 'Both mean "two". Use 两 (liǎng) before a measure word. Use 二 (èr) when counting, in numbers like 20, and in dates.',
      ex: [['我有两个孩子。', 'wǒ yǒu liǎng ge háizi.', 'I have two children.'], ['现在是二月。', 'xiànzài shì èr yuè.', "It's February now."], ['我二十岁。', 'wǒ èrshí suì.', "I'm twenty years old."]] },
    { t: 'Doing it for someone: 给', pat: '给 + person + verb',
      why: 'Put 给 (gěi) before a person to say you do something "to" or "for" them. On its own, 给 also means "to give".',
      ex: [['我给你打电话。', 'wǒ gěi nǐ dǎ diànhuà.', "I'll call you."], ['妈妈给我做饭。', 'māma gěi wǒ zuòfàn.', 'Mom cooks for me.'], ['请给我一杯茶。', 'qǐng gěi wǒ yì bēi chá.', 'Please give me a cup of tea.']] },
    { t: 'Measure words', pat: 'number + measure word + noun',
      why: 'Chinese puts a measure word between a number and a noun. 个 (gè) works for many things. Others: 杯 (bēi) for cups, 本 (běn) for books, 件 (jiàn) for clothes, 张 (zhāng) for tickets.',
      ex: [['一杯茶', 'yì bēi chá', 'a cup of tea'], ['一本书', 'yì běn shū', 'a book'], ['一件衣服', 'yí jiàn yīfu', 'a piece of clothing'], ['两张票', 'liǎng zhāng piào', 'two tickets'], ['三个人', 'sān ge rén', 'three people']] }
  ];

  function grammarV() {
    var h = '<div class="topbar"><button class="back" type="button" data-act="home">' + ICON.back + 'Lessons</button></div>';
    h += '<section class="hero"><p class="eyebrow">Plain-English grammar</p><h1>Grammar made simple</h1>' +
      '<p class="lede">Chinese has no verb endings and no plurals, so the rules are short. Open a point, read the pattern, then tap each sentence to hear it.</p></section>';
    h += GR.map(function (g) {
      return '<details class="g"><summary><span class="gt">' + g.t + '</span><span class="gp">' + g.pat + '</span></summary><div class="gb"><p class="why">' + g.why + '</p>' +
        g.ex.map(function (e) {
          return '<div class="gex"><div class="exb"><span class="zh exz" lang="zh-CN">' + e[0] + '</span><span class="exp">' + e[1] + '</span><span class="exe">' + e[2] + '</span></div>' +
            '<button class="icon-btn" type="button" data-act="say" data-say="' + e[0] + '" aria-label="Play sentence">' + ICON.speaker + '</button></div>';
        }).join('') + '</div></details>';
    }).join('');
    h += '<button class="btn" type="button" data-act="home">Back to lessons</button>';
    return h;
  }

  function render(scroll) {
    app.innerHTML = S.view === 'home' ? homeV() : S.view === 'tones' ? tonesV() : S.view === 'grammar' ? grammarV() : unitV();
    if (scroll) window.scrollTo(0, 0);
  }

  function finishQuiz() {
    var q = S.quiz, pct = q.score / q.qs.length;
    q.stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : 1;
    q.done = true;
    if (S.unit !== 'mix') P.stars[S.unit] = Math.max(P.stars[S.unit] || 0, q.stars);
    save();
  }

  function speakCurrentIfListen() {
    var q = S.quiz;
    if (S.tab === 'quiz' && q && !q.done && q.qs[q.i].t === 'listen') setTimeout(function () { speak(q.qs[q.i].w.zh); }, 150);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    var c = S.cards, q = S.quiz;
    switch (a) {
      case 'unit': S.view = 'unit'; S.unit = id; S.tab = 'words'; S.cards = null; S.quiz = null; render(true); break;
      case 'mix': S.view = 'unit'; S.unit = 'mix'; S.tab = 'quiz'; S.cards = null; S.quiz = null; render(true); speakCurrentIfListen(); break;
      case 'tones': S.view = 'tones'; render(true); break;
      case 'grammar': S.view = 'grammar'; render(true); break;
      case 'sayex': if (BY[id] && BY[id].ex) speak(BY[id].ex.zh); break;
      case 'home': S.view = 'home'; render(true); break;
      case 'tab': S.tab = id; if (id === 'cards') startCards(); if (id === 'quiz') startQuiz(); render(true); speakCurrentIfListen(); break;
      case 'say': speak(id && BY[id] ? BY[id].zh : t.getAttribute('data-say')); break;
      case 'pinyin': P.pinyin = !P.pinyin; save(); render(false); break;
      case 'flip': c.flipped = !c.flipped; render(false); if (c.flipped) speak(BY[c.queue[0]].zh); break;
      case 'again': c.queue.push(c.queue.shift()); c.flipped = false; render(false); break;
      case 'got': P.known[c.queue[0]] = true; save(); c.queue.shift(); c.done++; c.flipped = false; render(false); break;
      case 'restartCards': startCards(); render(false); break;
      case 'pick':
        if (q.picked) break;
        q.picked = id;
        if (id === q.qs[q.i].w.id) { q.score++; P.known[id] = true; save(); }
        render(false);
        break;
      case 'next':
        q.i++; q.picked = null;
        if (q.i >= q.qs.length) finishQuiz();
        render(true); speakCurrentIfListen();
        break;
      case 'retry': startQuiz(); render(true); speakCurrentIfListen(); break;
      case 'playq': speak(q.qs[q.i].w.zh); break;
    }
  });

  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch (e) {}
  }
  render(false);
})();
</script>
</body>
</html>
